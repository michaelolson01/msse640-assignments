<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle Classifier Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }

        .main-content {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .form-section {
            flex: 1;
            min-width: 300px;
        }

        .viz-section {
            flex: 1;
            min-width: 300px;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .viz-container {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .viz-title {
            font-size: 1.2em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }

        #triangleCanvas {
            width: 100%;
            height: 400px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 0.9em;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-color {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-color.red {
            background: #e74c3c;
        }

        .legend-color.blue {
            background: #3498db;
        }

        .legend-color.green {
            background: #2ecc71;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .classify-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .classify-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .classify-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .reset-btn {
            background: #f0f0f0;
            color: #555;
        }

        .reset-btn:hover {
            background: #e0e0e0;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result.show {
            display: block;
        }

        .result.equilateral {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .result.isosceles {
            background: #fff3cd;
            border: 2px solid #ffc107;
            color: #856404;
        }

        .result.scalene {
            background: #d1ecf1;
            border: 2px solid #17a2b8;
            color: #0c5460;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .result-type {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .result-details {
            font-size: 0.95em;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            color: #667eea;
            margin-top: 20px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .api-info {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 0.85em;
            color: #999;
        }

        .api-info input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔺 Triangle Classifier</h1>
        <p class="subtitle">Enter three side lengths to classify your triangle</p>

        <div class="main-content">
            <div class="form-section">
                <form id="triangleForm">
            <div class="input-group">
                <label for="sideA">Side A</label>
                <input type="number" id="sideA" name="a" min="0.01" step="any" required placeholder="Enter length">
            </div>

            <div class="input-group">
                <label for="sideB">Side B</label>
                <input type="number" id="sideB" name="b" min="0.01" step="any" required placeholder="Enter length">
            </div>

            <div class="input-group">
                <label for="sideC">Side C</label>
                <input type="number" id="sideC" name="c" min="0.01" step="any" required placeholder="Enter length">
            </div>

                    <div class="button-group">
                        <button type="submit" class="classify-btn">Classify Triangle</button>
                        <button type="reset" class="reset-btn">Reset</button>
                    </div>
                </form>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Classifying...</p>
                </div>

                <div class="result" id="result">
                    <div class="result-type" id="resultType"></div>
                    <div class="result-details" id="resultDetails"></div>
                </div>

                <div class="api-info">
                    <label for="apiUrl">API Endpoint:</label>
                    <input type="text" id="apiUrl" value="http://localhost:8080/classify" readonly>
                </div>
            </div>

            <div class="viz-section">
                <div class="viz-container">
                    <div class="viz-title">Triangle Visualization</div>
                    <svg id="triangleCanvas" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
                        <!-- Triangle will be drawn here -->
                    </svg>
                    <div class="legend">
                        <div class="legend-item">
                            <div class="legend-color red"></div>
                            <span>Side A</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color blue"></div>
                            <span>Side B</span>
                        </div>
                        <div class="legend-item">
                            <div class="legend-color green"></div>
                            <span>Side C</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('triangleForm');
        const loading = document.getElementById('loading');
        const result = document.getElementById('result');
        const resultType = document.getElementById('resultType');
        const resultDetails = document.getElementById('resultDetails');
        const apiUrlInput = document.getElementById('apiUrl');
        const svg = document.getElementById('triangleCanvas');

        // Draw initial lines (before classification)
        function drawInitialLines(a, b, c) {
            svg.innerHTML = '';
            
            const scale = 200 / Math.max(a || 1, b || 1, c || 1, 1);
            const scaledA = (a || 0) * scale;
            const scaledB = (b || 0) * scale;
            const scaledC = (c || 0) * scale;
            
            // Draw line A (red) - horizontal at top
            const lineA = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            lineA.setAttribute('x1', 100);
            lineA.setAttribute('y1', 100);
            lineA.setAttribute('x2', 100 + (scaledA || 50));
            lineA.setAttribute('y2', 100);
            lineA.setAttribute('stroke', '#e74c3c');
            lineA.setAttribute('stroke-width', '4');
            lineA.setAttribute('opacity', a ? '1' : '0.3');
            svg.appendChild(lineA);
            addLabel('a', 100 + (scaledA || 50) / 2, 85, '#e74c3c');
            
            // Draw line B (blue) - horizontal in middle
            const lineB = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            lineB.setAttribute('x1', 100);
            lineB.setAttribute('y1', 200);
            lineB.setAttribute('x2', 100 + (scaledB || 50));
            lineB.setAttribute('y2', 200);
            lineB.setAttribute('stroke', '#3498db');
            lineB.setAttribute('stroke-width', '4');
            lineB.setAttribute('opacity', b ? '1' : '0.3');
            svg.appendChild(lineB);
            addLabel('b', 100 + (scaledB || 50) / 2, 185, '#3498db');
            
            // Draw line C (green) - horizontal at bottom
            const lineC = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            lineC.setAttribute('x1', 100);
            lineC.setAttribute('y1', 300);
            lineC.setAttribute('x2', 100 + (scaledC || 50));
            lineC.setAttribute('y2', 300);
            lineC.setAttribute('stroke', '#2ecc71');
            lineC.setAttribute('stroke-width', '4');
            lineC.setAttribute('opacity', c ? '1' : '0.3');
            svg.appendChild(lineC);
            addLabel('c', 100 + (scaledC || 50) / 2, 285, '#2ecc71');
            
            // Add instruction text
            const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            text.setAttribute('x', 200);
            text.setAttribute('y', 360);
            text.setAttribute('text-anchor', 'middle');
            text.setAttribute('fill', '#999');
            text.setAttribute('font-size', '12');
            text.textContent = 'Enter values and click "Classify Triangle"';
            svg.appendChild(text);
        }

        // Draw triangle function (after classification)
        function drawTriangle(a, b, c) {
            // Clear previous drawing
            svg.innerHTML = '';
            
            if (!a || !b || !c || a <= 0 || b <= 0 || c <= 0) {
                drawInitialLines(a, b, c);
                return;
            }

            // Check if it's a valid triangle
            const isValid = (a + b > c) && (a + c > b) && (b + c > a);
            
            if (isValid) {
                // Calculate triangle coordinates using the cosine rule
                const scale = 200 / Math.max(a, b, c);
                const scaledC = c * scale;
                const scaledA = a * scale;
                const scaledB = b * scale;
                
                // Temporarily place points to calculate the shape
                let tempP1 = { x: 0, y: 0 };
                let tempP2 = { x: scaledC, y: 0 };
                
                // Use cosine rule to find angle at tempP1
                const cosAngle = (scaledC * scaledC + scaledA * scaledA - scaledB * scaledB) / (2 * scaledC * scaledA);
                const angle = Math.acos(Math.max(-1, Math.min(1, cosAngle)));
                
                let tempP3 = {
                    x: tempP1.x + scaledA * Math.cos(angle),
                    y: tempP1.y + scaledA * Math.sin(angle)
                };
                
                // Find bounding box
                const minX = Math.min(tempP1.x, tempP2.x, tempP3.x);
                const maxX = Math.max(tempP1.x, tempP2.x, tempP3.x);
                const minY = Math.min(tempP1.y, tempP2.y, tempP3.y);
                const maxY = Math.max(tempP1.y, tempP2.y, tempP3.y);
                
                const width = maxX - minX;
                const height = maxY - minY;
                
                // Center the triangle in the SVG
                const centerX = 200;
                const centerY = 200;
                const offsetX = centerX - (minX + width / 2);
                const offsetY = centerY - (minY + height / 2);
                
                // Apply offset to all points
                const p1 = { x: tempP1.x + offsetX, y: tempP1.y + offsetY };
                const p2 = { x: tempP2.x + offsetX, y: tempP2.y + offsetY };
                const p3 = { x: tempP3.x + offsetX, y: tempP3.y + offsetY };
                
                // Draw the triangle
                // Side A (red) - from p1 to p3
                const lineA = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                lineA.setAttribute('x1', p1.x);
                lineA.setAttribute('y1', p1.y);
                lineA.setAttribute('x2', p3.x);
                lineA.setAttribute('y2', p3.y);
                lineA.setAttribute('stroke', '#e74c3c');
                lineA.setAttribute('stroke-width', '4');
                svg.appendChild(lineA);
                
                // Side B (blue) - from p2 to p3
                const lineB = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                lineB.setAttribute('x1', p2.x);
                lineB.setAttribute('y1', p2.y);
                lineB.setAttribute('x2', p3.x);
                lineB.setAttribute('y2', p3.y);
                lineB.setAttribute('stroke', '#3498db');
                lineB.setAttribute('stroke-width', '4');
                svg.appendChild(lineB);
                
                // Side C (green) - from p1 to p2
                const lineC = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                lineC.setAttribute('x1', p1.x);
                lineC.setAttribute('y1', p1.y);
                lineC.setAttribute('x2', p2.x);
                lineC.setAttribute('y2', p2.y);
                lineC.setAttribute('stroke', '#2ecc71');
                lineC.setAttribute('stroke-width', '4');
                svg.appendChild(lineC);
                
                // Add labels
                addLabel('a', (p1.x + p3.x) / 2 - 15, (p1.y + p3.y) / 2, '#e74c3c');
                addLabel('b', (p2.x + p3.x) / 2 + 15, (p2.y + p3.y) / 2, '#3498db');
                addLabel('c', (p1.x + p2.x) / 2, p1.y + 20, '#2ecc71');
                
            } else {
                // Draw disconnected lines for invalid triangle
                const scale = 200 / Math.max(a, b, c);
                const scaledA = a * scale;
                const scaledB = b * scale;
                const scaledC = c * scale;
                
                // Draw line A (red) - horizontal at top
                const lineA = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                lineA.setAttribute('x1', 100);
                lineA.setAttribute('y1', 100);
                lineA.setAttribute('x2', 100 + scaledA);
                lineA.setAttribute('y2', 100);
                lineA.setAttribute('stroke', '#e74c3c');
                lineA.setAttribute('stroke-width', '4');
                svg.appendChild(lineA);
                addLabel('a', 100 + scaledA / 2, 85, '#e74c3c');
                
                // Draw line B (blue) - horizontal in middle
                const lineB = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                lineB.setAttribute('x1', 100);
                lineB.setAttribute('y1', 200);
                lineB.setAttribute('x2', 100 + scaledB);
                lineB.setAttribute('y2', 200);
                lineB.setAttribute('stroke', '#3498db');
                lineB.setAttribute('stroke-width', '4');
                svg.appendChild(lineB);
                addLabel('b', 100 + scaledB / 2, 185, '#3498db');
                
                // Draw line C (green) - horizontal at bottom
                const lineC = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                lineC.setAttribute('x1', 100);
                lineC.setAttribute('y1', 300);
                lineC.setAttribute('x2', 100 + scaledC);
                lineC.setAttribute('y2', 300);
                lineC.setAttribute('stroke', '#2ecc71');
                lineC.setAttribute('stroke-width', '4');
                svg.appendChild(lineC);
                addLabel('c', 100 + scaledC / 2, 285, '#2ecc71');
                
                // Add "Not a valid triangle" text
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', 200);
                text.setAttribute('y', 360);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('fill', '#dc3545');
                text.setAttribute('font-size', '14');
                text.setAttribute('font-weight', 'bold');
                text.textContent = '⚠ Not a valid triangle';
                svg.appendChild(text);
            }
        }

        function addLabel(text, x, y, color) {
            const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            label.setAttribute('x', x);
            label.setAttribute('y', y);
            label.setAttribute('fill', color);
            label.setAttribute('font-size', '16');
            label.setAttribute('font-weight', 'bold');
            label.setAttribute('text-anchor', 'middle');
            label.textContent = text;
            svg.appendChild(label);
        }

        // Update lines when inputs change (just show separate lines)
        function updateLinesFromInputs() {
            const a = parseFloat(document.getElementById('sideA').value) || 0;
            const b = parseFloat(document.getElementById('sideB').value) || 0;
            const c = parseFloat(document.getElementById('sideC').value) || 0;
            drawInitialLines(a, b, c);
        }

        document.getElementById('sideA').addEventListener('input', updateLinesFromInputs);
        document.getElementById('sideB').addEventListener('input', updateLinesFromInputs);
        document.getElementById('sideC').addEventListener('input', updateLinesFromInputs);

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const a = document.getElementById('sideA').value;
            const b = document.getElementById('sideB').value;
            const c = document.getElementById('sideC').value;

            // Show loading, hide result
            loading.classList.add('show');
            result.classList.remove('show');
            result.className = 'result';

            try {
                const apiUrl = apiUrlInput.value;
                const response = await fetch(`${apiUrl}?a=${a}&b=${b}&c=${c}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Hide loading
                loading.classList.remove('show');

                if (data.error) {
                    showResult('error', 'Error', data.error);
                } else {
                    const triangleType = data.type;
                    const details = `Triangle with sides ${data.a}, ${data.b}, ${data.c}`;
                    
                    // Draw the triangle visualization after getting response
                    drawTriangle(parseFloat(a), parseFloat(b), parseFloat(c));
                    
                    showResult(triangleType, triangleType, details);
                }
            } catch (error) {
                loading.classList.remove('show');
                showResult('error', 'Connection Error', 
                    `Could not connect to API server. Make sure the server is running at ${apiUrlInput.value}`);
                console.error('Error:', error);
            }
        });

        form.addEventListener('reset', () => {
            result.classList.remove('show');
            result.className = 'result';
            drawInitialLines(0, 0, 0);
        });

        function showResult(className, type, details) {
            result.className = `result ${className} show`;
            resultType.textContent = type;
            resultDetails.textContent = details;
        }

        // Auto-focus first input and draw initial lines
        document.getElementById('sideA').focus();
        drawInitialLines(0, 0, 0);
    </script>
</body>
</html>
